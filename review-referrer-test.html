<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>네이버 블로그로 이동합니다</title>
  <!-- 이 페이지는 리다이렉트 전용이므로 검색엔진에 색인시키지 않는다. -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://httpbin.org/headers">
  <!-- Referer 값은 브라우저가 정하므로 인스타그램 주소로 위조할 수 없다.
       대신 unsafe-url로 경로까지 보내, 네이버 유입분석에 origin('https://riririb.com/')이
       아니라 'https://riririb.com/review/'로 찍히게 한다 — 채널별 경로를 다르게 두면 구분된다.
       기본 정책(strict-origin-when-cross-origin)은 경로를 잘라내므로 명시가 필요하다.
       이 페이지는 공개 리다이렉트 스텁이라 전체 URL이 노출돼도 문제없다. -->
  <meta name="referrer" content="unsafe-url">
  <!-- JS가 꺼져 있어도 이동하도록 meta refresh를 함께 둔다. -->
  <meta http-equiv="refresh" content="0; url=https://httpbin.org/headers">
  <script>
    // replace()를 써야 뒤로가기가 이 페이지로 되돌아오지 않는다.
    location.replace("https://httpbin.org/headers");
  </script>
  <style>
    body { font-family: -apple-system, "Apple SD Gothic Neo", sans-serif;
           display: flex; align-items: center; justify-content: center;
           min-height: 100vh; margin: 0; color: #333; }
  </style>
</head>
<body>
  <p>자동으로 이동하지 않으면 <a href="https://httpbin.org/headers">여기를 눌러 주세요</a>.</p>
</body>
</html>
