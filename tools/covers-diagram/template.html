<!doctype html>
<meta charset="utf-8">
<!--
  다이어그램형 커버 템플릿 (1080×1080).

  대부분의 커버는 gen_cover.py(FLUX 배경 + 텍스트 오버레이)로 만들지만,
  구조를 그림으로 보여줘야 하는 글은 이 템플릿으로 만든다.
  원래 이 두 장은 소스 없이 PNG만 남아 있어서, 우상단 마크를 바꾸려고
  전체를 다시 그려야 했다(2026-09-29). 앞으로는 이 파일을 고쳐 재현한다.

  사용: render.py 가 window.__CFG__ 를 주입해 컷별로 렌더한다.
-->
<style>
  * { margin: 0; box-sizing: border-box; }
  /* body에만 배경을 주면 캔버스 여백이 흰색으로 남아 우하단에 흰 블록이 생긴다.
     html에도 같은 바탕색을 깔아 전면을 덮는다. */
  html { background: #16143a; }
  body {
    width: 1080px; height: 1080px; position: relative; overflow: hidden;
    background:
      linear-gradient(rgba(124,116,214,.07) 1px, transparent 1px) 0 0 / 60px 60px,
      linear-gradient(90deg, rgba(124,116,214,.07) 1px, transparent 1px) 0 0 / 60px 60px,
      radial-gradient(900px 600px at 50% 40%, #232057, #16143a 70%);
    font-family: "Pretendard", "Apple SD Gothic Neo", -apple-system, sans-serif;
    color: #fff;
  }
  /* 우상단 브랜드 마크 — gen_cover.py의 .mark와 같은 규격을 유지한다 */
  .mark {
    position: absolute; top: 58px; right: 58px;
    display: inline-flex; align-items: center; gap: 9px;
    font-family: "SF Mono", ui-monospace, monospace; font-size: 24px; font-weight: 600;
    background: rgba(0,0,0,.34); padding: 9px 18px; border-radius: 40px;
  }
  .mdot { width: 11px; height: 11px; border-radius: 50%; background: #2dd4bf; }

  .stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }

  .node {
    width: 152px; height: 152px; border-radius: 22px;
    background: #211d4f; border: 2px solid #6b5fd0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  }
  .node.hot { border-color: #2dd4bf; box-shadow: 0 0 34px rgba(45,212,191,.42); }
  .node .ico { font-size: 40px; line-height: 1; }
  .node .lb { font-family: "SF Mono", ui-monospace, monospace; font-size: 20px; color: #cfd2f2; }

  .errbox {
    border: 2px solid #f2536a; border-radius: 16px; background: rgba(120,20,40,.34);
    padding: 22px 34px; font-family: "SF Mono", ui-monospace, monospace;
    font-size: 27px; line-height: 1.5; color: #ff8a9c; text-align: center; white-space: pre;
  }

  .hl { position: absolute; left: 62px; bottom: 74px; font-size: 68px; font-weight: 800; line-height: 1.3; letter-spacing: -1px; }
  .hl .hi { background: #b2b6e8; color: #191640; padding: 2px 18px; border-radius: 12px;
            box-decoration-break: clone; -webkit-box-decoration-break: clone; }
</style>

<span class="mark"><span class="mdot"></span><span id="mark">riririb.dev</span></span>
<div class="stage" id="stage"></div>
<div class="hl" id="hl"></div>

<script>
  const C = window.__CFG__ || {};
  document.getElementById('mark').textContent = C.mark || 'riririb.dev';
  document.getElementById('stage').innerHTML = C.stage || '';
  document.getElementById('hl').innerHTML = C.headline || '';
</script>
